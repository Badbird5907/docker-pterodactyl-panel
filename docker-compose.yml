version: "3.4"
services:
  database:
    image: mariadb
    restart: always
    environment:
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: thisisthepasswordforpterodactyl
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
  cache:
    image: redis
    restart: always
  php-fpm:
    image: badbird5907/pterodactyl-panel:v1.15.2
    restart: always
    depends_on:
      - database
      - cache
    volumes:
      - app:/var/www/html/
      - storage:/var/www/html/storage/
      - public:/var/www/html/public/
    environment:
      APP_KEY: "${APP_KEY:?Set APP_KEY in your environment before starting}"
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: thisisthepasswordforpterodactyl
      REDIS_HOST: cache
      REDIS_PORT: 6379
  panel-upgrade:
    image: badbird5907/pterodactyl-panel:v1.15.2
    profiles:
      - upgrade
    depends_on:
      - database
      - cache
    volumes:
      - app:/var/www/html/
      - storage:/var/www/html/storage/
      - public:/var/www/html/public/
    environment:
      APP_KEY: "${APP_KEY:?Set APP_KEY in your environment before running upgrades}"
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: thisisthepasswordforpterodactyl
      REDIS_HOST: cache
      REDIS_PORT: 6379
    entrypoint: ["/bin/sh", "-c", "php artisan migrate --force"]
    restart: "no"
  nginx:
    image: yoshiwalsh/nginx-for-php-fpm
    restart: always
    depends_on:
      - php-fpm
    ports:
      - 5080:80
    volumes:
      - public:/var/www/html/

volumes:
  public:
  db:
  storage:
  app:
